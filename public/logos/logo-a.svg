  <text x="16" y="36" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white" letter-spacing="-0.5">tide</text>
  <text x="90" y="36" font-family="Arial, sans-serif" font-size="30" font-weight="300" fill="#38bdf8" letter-spacing="-0.5">now</text>
  <!-- Wave curve -->
  <path d="M16 68 C28 46, 44 46, 56 68 C68 90, 84 90, 96 68 C108 46, 124 46, 136 68 C148 90, 164 90, 176 68" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Live dot -->
